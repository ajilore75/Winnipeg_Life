<title>Winnipeg Life: Playbook and Game</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1822;--card:#142636;--ink:#e6eef5;--mut:#8ca3b7;--acc:#ff8a3d;--ln:#26405a;--good:#69db7c;--bad:#ff8787}}
:root[data-theme="dark"]{--bg:#0c1822;--card:#142636;--ink:#e6eef5;--mut:#8ca3b7;--acc:#ff8a3d;--ln:#26405a;--good:#69db7c;--bad:#ff8787}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0}
h1{font-size:44px;font-weight:800;line-height:1}
.sign{display:inline-block;background:var(--acc);color:#fff;font:800 14px "Barlow Condensed",sans-serif;padding:2px 8px;border-radius:3px;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:14px;margin:12px 0}
button{font:600 15px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
button:hover:not(:disabled){border-color:var(--acc)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.go{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center;font-size:17px}
.grid{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
small{color:var(--mut);display:block;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .num{font-size:30px;font-weight:800;line-height:1}
.bar{height:6px;background:var(--ln);border-radius:3px;margin-top:4px}.bar i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.wx{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.log p{margin:4px 0;padding-left:10px;border-left:3px solid var(--ln)}
.log p.g{border-color:var(--good)}.log p.b{border-color:var(--bad)}.log p.e{border-color:var(--acc)}
.hide{display:none}
#toast{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.t{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font:700 16px Barlow,sans-serif;animation:up 1.7s forwards}
@keyframes up{0%{opacity:0;transform:translateY(12px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.t{animation:none}}
.tabs{display:flex;gap:8px;margin:0 0 12px}.tabs button{text-align:center;font-weight:800;font-size:16px}
.tabs button.on,button.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.chip{width:auto;display:inline-block;margin:0 6px 6px 0;border-radius:20px;padding:6px 12px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px;width:100%}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
.it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--ln)}.it input{width:22px;height:22px;margin-top:2px;flex:none}
.it.dn b{text-decoration:line-through;color:var(--mut)}.pg{height:8px;background:var(--ln);border-radius:4px}.pg i{display:block;height:100%;background:var(--good);border-radius:4px}
#cv{width:100%;height:500px;display:block;border-radius:8px;touch-action:none}
.tip{border-left:3px solid var(--acc);padding-left:10px;margin:6px 0}
</style></head><body><main>

<div id="pb" class="hide"></div><div id="app" class="hide"></div>
<div id="toast" aria-live="polite"></div>
</main>

 {n:"Work 10 shifts",f:s=>s.shifts>=10},{n:"Enjoy 8 outings",f:s=>s.outs>=8},
 {n:"Go to 3 community gatherings",f:s=>s.comm>=3},{n:"Earn $2,500 in total",f:s=>s.earned>=2500},
 {n:"Reach day 15 with no tow truck",f:s=>s.day>=15&&s.tows==0,car:1},
 {n:"Land a skilled job",f:s=>s.skilled>=1,imm:1},{n:"Take 3 language classes",f:s=>s.lang>=3,imm:1}];
function pickGoals(){const pool=GOALS.map((g,i)=>i).filter(i=>(!GOALS[i].imm||S.imm)&&(!GOALS[i].car||S.car));
 for(let i=pool.length-1;i>0;i--){const j=R(0,i);[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,3)}
function chk(){S.goals.forEach(i=>{const g=GOALS[i];if(!S.done.includes(g.n)&&g.f(S)){S.done.push(g.n);S.money+=100;log("Goal complete: "+g.n+". +$100 and +300 score.","g");emit({t:"goal",g:g.n})}})}
function sc(){return Math.max(0,Math.round((S.money+S.mood*10+(S.imm?Math.min(S.exp,40)*5+S.lang*40+(S.cred?150:0):0)+S.done.length*300+(S.gave||0)*40)*(S.hard?1.25:1)))}
function badges(){const b=[];if(S.shifts>=15)b.push("Double-Double Veteran");if(S.outs>=10)b.push("Prairie Social Butterfly");
 if(S.car&&S.tows==0)b.push("Plugged In");if(S.money>=2000)b.push("Rainy-Day Saver");if(S.mood>=80)b.push("Winnipeg Optimist");
 if(S.done.length==3)b.push("Goal Getter");if(S.comm>=3)b.push("Community Pillar");if(S.over=="done"&&!b.length)b.push("Survivor");return b}

 if(typeof claude=="undefined")return;
